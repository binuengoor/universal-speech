server:
  host: "0.0.0.0"
  port: 8000
  api_key: ""
  cors_origins: ["*"]

defaults:
  engine: "edge-tts"
  voice: "en-US-AriaNeural"
  speed: 1.0
  response_format: "mp3"

cache:
  enabled: true
  max_entries: 500
  max_memory_mb: 50
  ttl_seconds: 86400

circuit_breaker:
  enabled: true
  timeout_seconds: 5.0
  fallback_engine: "kokoro"
  fallback_voice: "af_heart"
  cooldown_seconds: 60.0

stt:
  enabled: true
  default_engine: "groq"
  default_model: "whisper-1"
  fallback_engine: "local-whisper"
  cooldown_seconds: 60.0
  engines:
    groq:
      enabled: true
      api_key: ""
      default_model: "whisper-large-v3-turbo"
      timeout_seconds: 10.0
    local_whisper:
      enabled: true
      model_size: "base"
      device: "cpu"
      compute_type: "int8"
      cpu_threads: 4
      models_dir: "models/whisper"
    google_cloud:
      enabled: true
      credentials_path: "credentials/google-service-account.json"
      language_code: "en-US"
      timeout_seconds: 10.0

paths:
  piper_models_dir: "models/piper"
  kokoro_model_path: "models/kokoro/kokoro-v1.0.onnx"
  kokoro_voices_path: "models/kokoro/voices-v1.0.bin"
  whisper_models_dir: "models/whisper"

engines:
  edge_tts:
    enabled: true
    default_voice: "en-US-AriaNeural"
    native_format: "mp3"
    timeout_seconds: 5.0
  piper:
    enabled: false
    default_voice: "en_US-ryan-medium"
    native_format: "wav"
  kokoro:
    enabled: true
    default_voice: "af_heart"
    native_format: "wav"
  google_cloud:
    enabled: true
    credentials_path: "credentials/google-service-account.json"
    default_voice: "en-US-Neural2-F"
    native_format: "mp3"
    timeout_seconds: 8.0

openai_voice_map:
  alloy: "en-US-AriaNeural"
  echo: "en-US-GuyNeural"
  fable: "en-GB-SoniaNeural"
  onyx: "en-US-ChristopherNeural"
  nova: "en-US-JennyNeural"
  shimmer: "en-US-AnaNeural"

