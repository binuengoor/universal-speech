[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-speech-gateway"
version = "0.2.0"
description = "Universal OpenAI-compatible Speech Gateway supporting Text-to-Speech (Edge-TTS, Kokoro, Google Cloud) and Speech-to-Text (Groq, faster-whisper, Google Cloud)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Universal Speech Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "edge-tts>=6.1.10",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "google-cloud-texttospeech>=2.16.0",
    "google-cloud-speech>=2.25.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
all = [
    "kokoro-onnx>=0.3.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "openai>=1.14.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
