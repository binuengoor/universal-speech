services:
  universal-speech:
    image: ghcr.io/binuengoor/universal-speech:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-speech-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8880:8000"
    environment:
      - SPEECH_DEFAULT_TTS_ENGINE=edge-tts
      - SPEECH_DEFAULT_TTS_VOICE=en-US-AriaNeural
      - SPEECH_DEFAULT_STT_ENGINE=groq
      - SPEECH_DEFAULT_STT_MODEL=whisper-1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TTS_CACHE_ENABLED=true
      - TTS_CACHE_MAX_ENTRIES=500
      - TTS_CACHE_MAX_MEMORY_MB=50
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-service-account.json
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
